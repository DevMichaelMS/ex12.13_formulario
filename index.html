<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário EBAC</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container mt-4">
        <h1 class="text-center">Formulário de Cadastro</h1>
        <form>
            <div class="mb-3">
                <label class="form-label" for="nome">Nome:</label>
                <input class="form-control" type="text" name="nome" id="nome" placeholder="Digite seu nome" required>
            </div>
    
            <div class="mb-3">
                <label class="form-label" for="e-mail">E-mail:</label>
                <input type="email" class="form-control" name="e-mail" id="e-mail" placeholder="Digite seu e-mail" required>
            </div>
    
            <div class="mb-3">
                <label class="form-label d-block" for="telefone">Telefone:</label>
                <div class="form-check form-check-inline">
                    <input class="form-check-input" type="radio" name="tipoTelefone" id="cel">
                    <label class="form-check-label" for="cel">Celular</label>
                </div>
                <div class="form-check form-check-inline">
                    <input class="form-check-input" type="radio" name="tipoTelefone" id="res">
                    <label class="form-check-label" for="res">Fixo</label>
                </div>
                <input type="tel" class="form-control mt-2" name="telefone" id="telefone" inputmode="tel" placeholder="Selecione um tipo de telefone" required>
            </div>
    
            <button class="btn btn-dark btn-sm w-100" type="submit">Enviar</button>
    
            <div class="alert alert-success d-none text-center" role="alert">Formulário preenchido com sucesso!</div>
        </form>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/jquery-mask-plugin@1.14.16/dist/jquery.mask.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
